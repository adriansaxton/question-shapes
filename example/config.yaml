# Example run on an invented corpus of 21 dishes (19 groups). Paths are relative to this file.
corpus: corpus.jsonl
questions: questions.json
plans: plans.json
validators: validators.py
out_dir: results
k: 10

# Embeddings and hybrid. Delete these four lines to run only file-name lookup, field lookup and graph.
embedding_model: BAAI/bge-small-en-v1.5
model_cache: ../.models
query_prefix: "Represent this sentence for searching relevant passages: "
embedding_cache: results/embeddings-cache.npz

# Postgres with pgvector instead of the in-memory stores (needs psycopg):
# store: postgres
# dsn: postgresql://user:password@localhost:5432/qshapes
